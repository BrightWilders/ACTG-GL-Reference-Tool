<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Coding Tool</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 28px;
  color: #1f2937;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  color: #0d3b66;
  margin: 4px 0 6px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin: 0 0 24px;
  font-size: 15px;
}

.search-box {
  margin-bottom: 18px;
}

.search-box input {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

.search-box input:focus {
  outline: none;
  border-color: #0d3b66;
  box-shadow: 0 0 0 2px rgba(13,59,102,.08);
}

.results {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: #fff;
  padding: 16px 19px;
  border-radius: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,.06);
  border-left: 5px solid #0d3b66;
}

.card-title {
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid #e2e8f0;
}

.card-title h3 {
  margin: 0;
  color: #0d3b66;
  font-size: 18px;
  line-height: 1.35;
}

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
}

.full {
  grid-column: 1 / -1;
}

.label {
  font-weight: 700;
}

.gl-account {
  font-size: 15px;
}

.memo {
  margin-top: 10px;
  background: #eef3f8;
  padding: 8px 10px;
  border-radius: 6px;
}

.note {
  margin-top: 12px;
  background: #fff3cd;
  border-left: 4px solid #f0ad4e;
  padding: 9px 11px;
  border-radius: 5px;
  font-weight: 600;
}

.empty {
  background: white;
  padding: 22px;
  text-align: center;
  border-radius: 10px;
  color: #64748b;
}

@media (max-width: 700px) {

  body {
    padding: 18px;
  }

  .details-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

}

</style>

</head>

<body>

<div class="container">

  <h1>Expense Coding Tool</h1>

  <p class="subtitle">
    Search by item, keyword, GL account, department, or entity.
  </p>

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search item, keyword, GL account, department, or entity..."
      oninput="renderResults()"
      autocomplete="off"
    >

  </div>

  <div
    class="results"
    id="results"
  ></div>

</div>


<!-- Shared master coding data -->
<script src="coding-library.js"></script>


<script>

const USER_KEYWORD_STORE =
  "expenseCodingKeywordsV1";


/*
  USER HUB RULE

  Only records marked:

  User
  Both

  will appear here.

  Admin-only records stay hidden.
*/

const userItems =
  codingLibrary.filter(item =>
    item.Visibility === "User" ||
    item.Visibility === "Both"
  );


/*
  Browser keyword data is included
  for compatibility with the library.
*/

const savedKeywords =
  JSON.parse(
    localStorage.getItem(USER_KEYWORD_STORE) || "{}"
  );


function keywordsFor(item) {

  const defaults =
    defaultKeywords[item.Item] || [];

  const saved =
    savedKeywords[item.Item] || [];

  const itemKeywords =
    item.Keywords || [];

  return [
    ...new Set([
      ...defaults,
      ...itemKeywords,
      ...saved
    ])
  ];

}


function entitiesFor(value) {

  if (!value) {
    return "";
  }

  const expanded =
    entityExpansion[value];

  if (expanded) {
    return expanded.join(", ");
  }

  return value;

}


function searchableText(item) {

  return [

    item.Item,
    item.GLNumber,
    item.GLName,
    item.Department,
    item.Class,
    item.ItemFlag,
    entitiesFor(item.Entity),
    item.Memo,
    item.Note,
    ...keywordsFor(item)

  ]

  .filter(Boolean)
  .join(" ")
  .toLowerCase();

}


function renderResults() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const container =
    document.getElementById("results");


  /*
    Keep the page blank until
    the user actually searches.
  */

  if (!search) {

    container.innerHTML = "";

    return;

  }


  const matches =
    userItems.filter(item =>
      searchableText(item).includes(search)
    );


  if (!matches.length) {

    container.innerHTML =
      '<div class="empty">No matches found.</div>';

    return;

  }


  container.innerHTML =
    matches.map(item => {

      return `

        <div class="card">

          <div class="card-title">

            <h3>
              ${item.Item}
            </h3>

          </div>


          <div class="details-grid">

            <div class="full gl-account">

              <span class="label">
                GL Account:
              </span>

              ${item.GLNumber} - ${item.GLName}

            </div>


            <div>

              <span class="label">
                Department:
              </span>

              ${item.Department || ""}

            </div>


            <div>

              <span class="label">
                Class:
              </span>

              ${item.Class || ""}

            </div>


            <div>

              <span class="label">
                Item:
              </span>

              ${item.ItemFlag || ""}

            </div>


            <div>

              <span class="label">
                Applicable Entities:
              </span>

              ${entitiesFor(item.Entity)}

            </div>


            ${
              item.Memo
              ? `

                <div class="full memo">

                  <span class="label">
                    Memo:
                  </span>

                  ${item.Memo}

                </div>

              `
              : ""
            }

          </div>


          ${
            item.Note
            ? `

              <div class="note">
                ${item.Note}
              </div>

            `
            : ""
          }

        </div>

      `;

    }).join("");

}


renderResults();

</script>

</body>

</html>
