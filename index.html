<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Coding Tool</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 28px;
  color: #1f2937;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
}


/* HEADER */

h1 {
  text-align: center;
  color: #0d3b66;
  margin: 4px 0 6px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin: 0 0 18px;
  font-size: 15px;
}


/* REFERENCE BUTTONS */

.reference-links {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.reference-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  background: #ffffff;
  color: #0d3b66;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}

.reference-button:hover {
  background: #eef3f8;
}


/* SEARCH */

.search-box {
  margin-bottom: 18px;
}

.search-box input {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

.search-box input:focus {
  outline: none;
  border-color: #0d3b66;
  box-shadow: 0 0 0 2px rgba(13,59,102,.08);
}


/* RESULTS */

.results {
  display: flex;
  flex-direction: column;
  gap: 14px;
}


/* RESULT CARD */

.card {
  background: #ffffff;
  border-radius: 10px;
  padding: 0;
  overflow: hidden;
  box-shadow: 0 2px 7px rgba(0,0,0,.06);
  border-left: 5px solid #0d3b66;
}


/* ITEM / SEARCH RESULT */

.card-title {
  padding: 15px 18px 13px;
  background: #ffffff;
  border-bottom: 1px solid #dfe5ec;
}

.card-title h3 {
  margin: 0;
  color: #0d3b66;
  font-size: 18px;
  line-height: 1.35;
}


/* CODING AREA */

.coding-details {
  padding: 14px 18px 16px;
  background: #fafbfd;
}

.gl-account {
  font-size: 15px;
  margin-bottom: 12px;
}

.gl-account .value {
  font-weight: 700;
  color: #1f2937;
}

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 28px;
}

.detail-row {
  line-height: 1.45;
}

.full {
  grid-column: 1 / -1;
}

.label {
  font-weight: 700;
  color: #374151;
}


/* MEMO */

.memo {
  margin-top: 12px;
  padding: 9px 11px;
  background: #eef3f8;
  border-radius: 6px;
}


/* NOTE */

.note {
  margin-top: 12px;
  background: #fff3cd;
  border-left: 4px solid #f0ad4e;
  padding: 9px 11px;
  border-radius: 5px;
  font-weight: 600;
}


/* NO RESULTS */

.empty {
  background: white;
  padding: 22px;
  text-align: center;
  border-radius: 10px;
  color: #64748b;
}


/* MOBILE */

@media (max-width: 700px) {

  body {
    padding: 18px;
  }

  .details-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

}

</style>

</head>


<body>

<div class="container">


  <h1>Expense Coding Tool</h1>

  <p class="subtitle">
    Search by item, keyword, GL account, department, or entity.
  </p>


  <div class="reference-links">

    <!--
      We will connect these to the actual separate
      GitHub Pages URLs in the next step.
    -->

    <a
      class="reference-button"
      id="codingReferenceLink"
      href="#"
      onclick="referenceNotConnected(event)"
    >
      📘 Coding Reference
    </a>

    <a
      class="reference-button"
      id="entityGuideLink"
      href="#"
      onclick="referenceNotConnected(event)"
    >
      🏢 Entity Guide
    </a>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search item, keyword, GL account, department, or entity..."
      oninput="renderResults()"
      autocomplete="off"
    >

  </div>


  <div
    class="results"
    id="results"
  ></div>


</div>


<!-- SHARED MASTER CODING LIBRARY -->

<script src="coding-library.js"></script>


<script>


/*
  USER VISIBILITY RULE

  USER
  = visible to users + admins

  ADMIN
  = admin only

  BOTH
  = temporarily treated as User
    while older records are migrated.
*/

const userItems =
  codingLibrary.filter(item =>
    item.Visibility === "User" ||
    item.Visibility === "Both"
  );


function keywordsFor(item) {

  const defaults =
    defaultKeywords[item.Item] || [];

  const itemKeywords =
    item.Keywords || [];

  return [
    ...new Set([
      ...defaults,
      ...itemKeywords
    ])
  ];

}


function entitiesFor(value) {

  if (!value) {
    return "";
  }

  const expanded =
    entityExpansion[value];

  if (expanded) {
    return expanded.join(", ");
  }

  return value;

}


function searchableText(item) {

  return [

    item.Item,
    item.GLNumber,
    item.GLName,
    item.Department,
    item.Class,
    item.ItemFlag,
    entitiesFor(item.Entity),
    item.Memo,
    item.Note,
    ...keywordsFor(item)

  ]

  .filter(Boolean)
  .join(" ")
  .toLowerCase();

}


function renderResults() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const container =
    document.getElementById("results");


  /*
    Opening screen stays blank
    until the user searches.
  */

  if (!search) {

    container.innerHTML = "";

    return;

  }


  const matches =
    userItems.filter(item =>
      searchableText(item).includes(search)
    );


  if (!matches.length) {

    container.innerHTML =
      '<div class="empty">No matches found.</div>';

    return;

  }


  container.innerHTML =
    matches.map(item => {

      return `

        <div class="card">


          <!-- ITEM BEING LOOKED UP -->

          <div class="card-title">

            <h3>
              ${item.Item}
            </h3>

          </div>


          <!-- CODING INFORMATION -->

          <div class="coding-details">


            <div class="gl-account">

              <span class="label">
                GL Account:
              </span>

              <span class="value">
                ${item.GLNumber} - ${item.GLName}
              </span>

            </div>


            <div class="details-grid">


              <div class="detail-row">

                <span class="label">
                  Department:
                </span>

                ${item.Department || ""}

              </div>


              <div class="detail-row">

                <span class="label">
                  Class:
                </span>

                ${item.Class || ""}

              </div>


              <div class="detail-row">

                <span class="label">
                  Item:
                </span>

                ${item.ItemFlag || ""}

              </div>


              <div class="detail-row">

                <span class="label">
                  Applicable Entities:
                </span>

                ${entitiesFor(item.Entity)}

              </div>


            </div>


            ${
              item.Memo
              ? `

                <div class="memo">

                  <span class="label">
                    Memo:
                  </span>

                  ${item.Memo}

                </div>

              `
              : ""
            }


            ${
              item.Note
              ? `

                <div class="note">
                  ${item.Note}
                </div>

              `
              : ""
            }


          </div>


        </div>

      `;

    }).join("");

}


function referenceNotConnected(event) {

  event.preventDefault();

  alert(
    "We will connect this button to the separate reference tool next."
  );

}


renderResults();


</script>


</body>

</html>
