<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Coding Tool</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 28px;
  color: #1f2937;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
}


/* HEADER */

h1 {
  text-align: center;
  color: #0d3b66;
  margin: 4px 0 6px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin: 0 0 18px;
  font-size: 15px;
}


/* REFERENCE BUTTONS */

.reference-links {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.reference-button {
  display: inline-flex;
  align-items: center;
  padding: 9px 14px;
  background: #ffffff;
  color: #0d3b66;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}

.reference-button:hover {
  background: #eef3f8;
}


/* SEARCH */

.search-box {
  margin-bottom: 18px;
}

.search-box input {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
  background: #ffffff;
}

.search-box input:focus {
  outline: none;
  border-color: #0d3b66;
  box-shadow: 0 0 0 2px rgba(13,59,102,.08);
}


/* RESULTS */

.results {
  display: flex;
  flex-direction: column;
  gap: 14px;
}


/* RESULT CARD */

.card {
  background: #ffffff;
  border-radius: 10px;
  padding: 18px 22px;
  box-shadow: 0 2px 7px rgba(0,0,0,.06);
  border-left: 5px solid #0d3b66;
}


/* ITEM NAME */

.card-title {
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid #e2e8f0;
}

.card-title h3 {
  margin: 0;
  color: #0d3b66;
  font-size: 18px;
  line-height: 1.35;
}


/* CODING INFORMATION */

.coding-details {
  padding: 0;
}

.coding-line {
  margin: 6px 0;
  font-size: 15px;
  line-height: 1.45;
}

.label {
  font-weight: 700;
  color: #1f2937;
}


/* MEMO */

.memo {
  margin-top: 16px;
  padding: 10px 12px;
  background: #eef4fa;
  border-left: 4px solid #0d3b66;
  border-radius: 5px;
  font-size: 15px;
  line-height: 1.45;
}

.memo .label {
  color: #0d3b66;
  font-weight: 800;
}


/* NOTE / WARNING */

.note {
  margin-top: 14px;
  background: #fff3cd;
  border-left: 4px solid #f0ad4e;
  padding: 9px 11px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.45;
}


/* NO RESULTS */

.empty {
  background: #ffffff;
  padding: 22px;
  text-align: center;
  border-radius: 10px;
  color: #64748b;
}


/* MOBILE */

@media (max-width: 700px) {

  body {
    padding: 18px;
  }

  .card {
    padding: 16px 18px;
  }

}

</style>

</head>


<body>

<div class="container">


  <h1>Expense Coding Tool</h1>

  <p class="subtitle">
    Search by item, keyword, GL account, department, or entity.
  </p>


  <div class="reference-links">

    <a
      class="reference-button"
      id="codingReferenceLink"
      href="#"
      onclick="referenceNotConnected(event)"
    >
      Coding Reference
    </a>

    <a
      class="reference-button"
      id="entityGuideLink"
      href="#"
      onclick="referenceNotConnected(event)"
    >
      Entity Guide
    </a>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="Search item, keyword, GL account, department, or entity..."
      oninput="renderResults()"
      autocomplete="off"
    >

  </div>


  <div
    class="results"
    id="results"
  ></div>


</div>


<!-- SHARED MASTER CODING LIBRARY -->

<script src="coding-library.js"></script>


<script>


/*
  VISIBILITY RULE

  User = visible on User Hub
  Admin = hidden from User Hub

  Both is temporarily supported
  for older library records.
*/

const userItems =
  codingLibrary.filter(item =>
    item.Visibility === "User" ||
    item.Visibility === "Both"
  );


/* KEYWORDS */

function keywordsFor(item) {

  const defaults =
    defaultKeywords[item.Item] || [];

  const itemKeywords =
    item.Keywords || [];

  return [
    ...new Set([
      ...defaults,
      ...itemKeywords
    ])
  ];

}


/* ENTITY DISPLAY */

function entitiesFor(value) {

  if (!value) {
    return "";
  }

  const expanded =
    entityExpansion[value];

  if (expanded) {
    return expanded.join(", ");
  }

  return value;

}


/* SEARCHABLE CONTENT */

function searchableText(item) {

  return [

    item.Item,
    item.GLNumber,
    item.GLName,
    item.Department,
    item.Class,
    item.ItemFlag,
    entitiesFor(item.Entity),
    item.Memo,
    item.Note,
    ...keywordsFor(item)

  ]

  .filter(Boolean)
  .join(" ")
  .toLowerCase();

}


/* DISPLAY RESULTS */

function renderResults() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const container =
    document.getElementById("results");


  /*
    Keep opening screen blank
    until something is searched.
  */

  if (!search) {

    container.innerHTML = "";

    return;

  }


  const matches =
    userItems.filter(item =>
      searchableText(item).includes(search)
    );


  if (!matches.length) {

    container.innerHTML =
      '<div class="empty">No matches found.</div>';

    return;

  }


  container.innerHTML =
    matches.map(item => {

      return `

        <div class="card">


          <div class="card-title">

            <h3>
              ${item.Item}
            </h3>

          </div>


          <div class="coding-details">


            <div class="coding-line">

              <span class="label">
                Category/GL Code:
              </span>

              ${item.GLNumber} - ${item.GLName}

            </div>


            <div class="coding-line">

              <span class="label">
                Department:
              </span>

              ${item.Department || ""}

            </div>


            <div class="coding-line">

              <span class="label">
                Class:
              </span>

              ${item.Class || ""}

            </div>


            <div class="coding-line">

              <span class="label">
                Item:
              </span>

              ${item.ItemFlag || ""}

            </div>


            <div class="coding-line">

              <span class="label">
                Applicable Entities:
              </span>

              ${entitiesFor(item.Entity)}

            </div>


            ${
              item.Memo
              ? `

                <div class="memo">

                  <span class="label">
                    Memo:
                  </span>

                  ${item.Memo}

                </div>

              `
              : ""
            }


            ${
              item.Note
              ? `

                <div class="note">
                  ${item.Note}
                </div>

              `
              : ""
            }


          </div>


        </div>

      `;

    }).join("");

}


/* TEMPORARY REFERENCE BUTTON MESSAGE */

function referenceNotConnected(event) {

  event.preventDefault();

  alert(
    "We will connect this button to the separate reference tool next."
  );

}


/* INITIAL LOAD */

renderResults();


</script>

</body>

</html>
